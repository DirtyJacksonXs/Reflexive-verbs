<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¡Reto reflexivo! — Aprende español</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#263b4a;--muted:#758796;--green:#58cc02;--darkgreen:#46a302;--blue:#1cb0f6;--yellow:#ffc800;--red:#ff4b4b;--paper:#fff;--line:#e5edf2}
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:var(--ink);font-family:Nunito,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:22px 26px 60px}.top{display:flex;align-items:center;gap:24px;border-bottom:2px solid var(--line);padding:4px 0 18px}.brand{font-size:23px;font-weight:1000;color:#58a700;white-space:nowrap}.progress{height:16px;border-radius:20px;background:#e5edf2;flex:1;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:.45s;border-radius:20px}.hearts{font-weight:900;color:#ff5964;font-size:17px;white-space:nowrap}.layout{display:grid;grid-template-columns:220px 1fr;gap:30px;margin-top:28px}.side{display:flex;flex-direction:column;gap:12px}.sidecard{border:2px solid var(--line);border-radius:16px;background:white;padding:16px;color:var(--muted);font-weight:800}.sidecard.active{border-color:#84d8ff;background:#effaff;color:#1388be}.sidecard span{font-size:22px;margin-right:9px}.main{min-width:0}.eyebrow{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:#8b9ba8;font-weight:900}.title{font-size:30px;font-weight:1000;margin:7px 0 5px}.sub{margin:0 0 22px;color:var(--muted);font-weight:700}.card{background:white;border:2px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 5px 0 #e9eff3}.question-row{display:flex;gap:18px;align-items:center;margin-bottom:22px}.mascot{font-size:48px;flex:none;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-5px)}}.prompt{font-size:22px;font-weight:900;line-height:1.35}.translation{font-size:14px;color:var(--muted);margin-top:5px}.answers{display:grid;gap:12px}.answer{background:white;border:2px solid #dce5eb;border-radius:14px;padding:15px 17px;text-align:left;font:800 17px Nunito;cursor:pointer;color:var(--ink);transition:.15s}.answer:hover{background:#f5fbff;border-color:#9fdcff;transform:translateY(-1px)}.answer.selected{border-color:#1cb0f6;background:#eefaff}.answer.correct{border-color:var(--green);background:#efffe5;color:#397c00}.answer.wrong{border-color:var(--red);background:#fff0f0;color:#c83030}.answer:disabled{cursor:default}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.hint{font-size:14px;color:var(--muted);font-weight:700;min-height:24px}.btn{border:0;border-radius:13px;padding:13px 24px;font:900 15px Nunito;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}.btn.primary{background:var(--green);color:white;box-shadow:0 4px 0 var(--darkgreen)}.btn.primary:disabled{background:#dce5eb;color:#9aa9b4;box-shadow:0 4px 0 #cad5dc;cursor:not-allowed}.feedback{margin-top:18px;padding:13px 16px;border-radius:12px;font-weight:800;display:none}.feedback.show{display:block}.feedback.good{background:#efffe5;color:#438c00}.feedback.bad{background:#fff0f0;color:#c83030}.lesson-intro{background:white;border:2px solid var(--line);border-radius:22px;padding:30px}.lesson-intro h1{font-size:34px;margin:0}.lesson-intro p{color:var(--muted);font-weight:700;font-size:17px}.pronouns{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:22px 0}.pronoun{background:#f4f9fc;border:2px solid var(--line);border-radius:14px;text-align:center;padding:12px 4px;font-weight:900}.pronoun b{display:block;color:#159fe0;font-size:23px}.start{font-size:16px}.complete{text-align:center;padding:48px 20px}.complete .trophy{font-size:78px}.complete h1{font-size:34px;margin:10px}.complete p{font-size:18px;color:var(--muted);font-weight:700}.stat{display:inline-block;background:#fff8dc;border:2px solid #ffe184;padding:12px 22px;border-radius:14px;margin:12px;font-weight:900}.bottom-note{font-size:12px;color:#a4b0b8;text-align:center;margin-top:25px}@media(max-width:700px){.shell{padding:14px}.layout{display:block;margin-top:20px}.side{flex-direction:row;overflow:auto;margin-bottom:17px}.sidecard{white-space:nowrap;padding:10px 13px}.title{font-size:25px}.card{padding:18px}.pronouns{grid-template-columns:repeat(3,1fr)}.brand{font-size:18px}.top{gap:12px}}
</style></head>
<body><div class="shell">
<header class="top"><div class="brand">✨ ¡Hola, español!</div><div class="progress"><div class="fill" id="bar"></div></div><div class="hearts">❤️ <span id="hearts">5</span></div></header>
<div class="layout"><nav class="side"><div class="sidecard active"><span>🌞</span>Rutina diaria</div><div class="sidecard"><span>🧩</span>Pronombres</div><div class="sidecard"><span>🏆</span>Desafío</div></nav><main class="main" id="app"></main></div><div class="bottom-note">Una práctica corta cada día hace la diferencia 🌱</div></div>
<script>
const qs=[
{q:"Completa: ___ despierto a las siete.",en:"I wake up at seven.",opts:["Me","Te","Se","Nos"],a:"Me",why:"Con «yo» usamos me: me despierto."},
{q:"Lucía ___ ducha por la mañana.",en:"Lucía showers in the morning.",opts:["me","se","nos","te"],a:"se",why:"Con «ella» usamos se: Lucía se ducha."},
{q:"¿Qué pronombre va con «nosotros»?",en:"Choose the reflexive pronoun for we.",opts:["se","me","nos","os"],a:"nos",why:"Nosotros y nosotras se combinan con nos."},
{q:"Tú ___ cepillas los dientes después del desayuno.",en:"You brush your teeth after breakfast.",opts:["te","se","me","nos"],a:"te",why:"Con «tú» usamos te: te cepillas."},
{q:"Mis hermanos ___ acuestan tarde.",en:"My siblings go to bed late.",opts:["os","nos","se","me"],a:"se",why:"Con «ellos/ellas» usamos se: se acuestan."},
{q:"Cada mañana, nosotros ___ vestimos rápido.",en:"Every morning, we get dressed quickly.",opts:["nos","se","me","te"],a:"nos",why:"«Nosotros» + nos: nos vestimos."},
{q:"Yo ___ lavo la cara antes de desayunar.",en:"I wash my face before breakfast.",opts:["se","me","te","nos"],a:"me",why:"Con «yo» usamos me: me lavo."},
{q:"Ustedes ___ preparan para ir a clase.",en:"You all get ready to go to class.",opts:["se","nos","os","me"],a:"se",why:"En Latinoamérica, «ustedes» usa se."},
{q:"Ordena la idea: «me / por la noche / acuesto»",en:"I go to bed at night.",opts:["Me acuesto por la noche.","Acuesto me por la noche.","Por la noche acuesto."],a:"Me acuesto por la noche.",why:"El pronombre va antes del verbo conjugado: me acuesto."},
{q:"Él ___ peina antes de salir.",en:"He combs his hair before leaving.",opts:["te","se","me","nos"],a:"se",why:"Con «él» usamos se: se peina."},
{q:"Vosotras ___ maquilláis para la fiesta.",en:"You (Spain, plural) put on makeup for the party.",opts:["os","se","nos","te"],a:"os",why:"Con «vosotros/vosotras» usamos os."},
{q:"Completa: Por la noche, Ana ___ desmaquilla.",en:"At night, Ana removes her makeup.",opts:["me","te","se","nos"],a:"se",why:"Ana = ella; ella se desmaquilla."}
];
let i=0,hearts=5,score=0,chosen=null,locked=false;
const app=document.getElementById("app"),bar=document.getElementById("bar");
function intro(){app.innerHTML='<section class="lesson-intro"><div class="eyebrow">UNIDAD 1 · A1</div><h1>Mi rutina, en español ☀️</h1><p>¡Ayuda a nuestro búho a completar su día! Elige el pronombre reflexivo correcto y gana puntos en cada reto.</p><div class="pronouns"><div class="pronoun">yo<b>me</b></div><div class="pronoun">tú<b>te</b></div><div class="pronoun">él / ella<b>se</b></div><div class="pronoun">nosotros<b>nos</b></div><div class="pronoun">vosotros<b>os</b></div><div class="pronoun">ellos / ellas<b>se</b></div></div><p>12 preguntas · 5 corazones · ¡Puedes repetir la lección!</p><button class="btn primary start" onclick="render()">¡Empezar! 🚀</button></section>'}
function render(){if(i>=qs.length||hearts<=0){finish();return}chosen=null;locked=false;const x=qs[i];bar.style.width=(i/qs.length*100)+"%";document.getElementById("hearts").textContent=hearts;app.innerHTML='<div class="eyebrow">RETO '+(i+1)+' DE '+qs.length+'</div><h2 class="title">Elige la respuesta correcta</h2><p class="sub">Completa la frase con el pronombre reflexivo.</p><section class="card"><div class="question-row"><div class="mascot">🦉</div><div><div class="prompt">'+x.q+'</div><div class="translation">'+x.en+'</div></div></div><div class="answers">'+x.opts.map((o,n)=>'<button class="answer" data-n="'+n+'" onclick="selectAnswer('+n+')">'+String.fromCharCode(65+n)+'. &nbsp;'+o+'</button>').join("")+'</div><div id="feedback" class="feedback"></div><div class="actions"><div class="hint" id="hint">Toca una opción para responder.</div><button id="check" class="btn primary" disabled onclick="checkAnswer()">Comprobar</button></div></section>'}
function selectAnswer(n){if(locked)return;chosen=n;document.querySelectorAll(".answer").forEach(b=>b.classList.toggle("selected",+b.dataset.n===n));document.getElementById("check").disabled=false;document.getElementById("hint").textContent="¡Listo! Pulsa comprobar."}
function checkAnswer(){if(chosen===null||locked)return;locked=true;const x=qs[i],buttons=[...document.querySelectorAll(".answer")],picked=x.opts[chosen],correct=picked===x.a;buttons.forEach(b=>{b.disabled=true;if(b.textContent.includes(x.a))b.classList.add("correct")});const fb=document.getElementById("feedback");fb.className="feedback show "+(correct?"good":"bad");fb.textContent=(correct?"¡Muy bien! 🎉 ":"Casi, ¡tú puedes! 💪 ")+x.why;if(correct)score++;else hearts--;document.getElementById("hearts").textContent=hearts;document.getElementById("hint").textContent="";const btn=document.getElementById("check");btn.disabled=false;btn.textContent=i===qs.length-1||hearts===0?"Ver resultado":"Continuar";btn.onclick=()=>{i++;render()}}
function finish(){bar.style.width="100%";const pct=Math.round(score/qs.length*100);app.innerHTML='<section class="lesson-intro complete"><div class="trophy">'+(pct>=75?"🏆":"🌟")+'</div><h1>'+(pct>=75?"¡Lección completada!":"¡Buen intento!")+'</h1><p>'+(pct>=75?"¡Ya dominas un montón de verbos de tu rutina!":"Cada práctica te ayuda a aprender. ¡Vamos otra vez!")+'</p><div class="stat">⭐ '+score+' / '+qs.length+' correctas</div><div class="stat">❤️ '+hearts+' corazones</div><br><button class="btn primary start" onclick="restart()">Practicar otra vez ↻</button></section>'}
function restart(){i=0;hearts=5;score=0;document.getElementById("hearts").textContent=5;intro()}
intro();
</script></body></html>
