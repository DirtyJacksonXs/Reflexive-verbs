<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¡Reto reflexivo! — Aprende español</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#263b4a;--muted:#758796;--green:#58cc02;--dark:#46a302;--blue:#1cb0f6;--line:#e5edf2}*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:var(--ink);font-family:Nunito,system-ui,sans-serif}.shell{max-width:1000px;margin:auto;padding:22px 26px 50px}.top{display:flex;align-items:center;gap:20px;border-bottom:2px solid var(--line);padding:5px 0 17px}.brand{font-size:23px;font-weight:1000;color:#58a700}.top-right{margin-left:auto;color:#ff5964;font-weight:1000}.layout{display:grid;grid-template-columns:220px 1fr;gap:30px;margin-top:26px}.side{display:flex;flex-direction:column;gap:12px}.nav{border:2px solid var(--line);border-radius:17px;background:white;padding:16px;color:var(--muted);font:900 16px Nunito;text-align:left;cursor:pointer;transition:.18s}.nav span{font-size:22px;margin-right:10px}.nav:hover{transform:translateY(-2px);border-color:#9edfff}.nav.active{border-color:#84d8ff;background:#effaff;color:#1388be}.main{min-width:0}.eyebrow{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:#8b9ba8;font-weight:900}.title{font-size:30px;font-weight:1000;margin:7px 0 5px}.sub{margin:0 0 22px;color:var(--muted);font-weight:700}.card{background:white;border:2px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 5px 0 #e9eff3}.welcome{font-size:32px;font-weight:1000;margin:0}.welcomesub{font-size:17px;color:var(--muted);font-weight:700;margin:8px 0 22px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{border:2px solid var(--line);border-radius:20px;background:white;padding:22px;text-align:left;cursor:pointer;transition:.18s;box-shadow:0 4px 0 #e9eff3;color:var(--ink)}.tile:hover{transform:translateY(-3px);border-color:#84d8ff}.tile .emoji{font-size:35px}.tile h3{font-size:20px;margin:10px 0 4px}.tile p{margin:0;color:var(--muted);font-weight:700;line-height:1.45}.tile small{display:block;margin-top:13px;color:#1388be;font-weight:1000;text-transform:uppercase;letter-spacing:.4px}.pronouns{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0}.pronoun{background:#f4f9fc;border:2px solid var(--line);border-radius:14px;text-align:center;padding:10px 3px;font-weight:900}.pronoun b{display:block;color:#159fe0;font-size:22px}.question-row{display:flex;gap:16px;align-items:center;margin-bottom:20px}.mascot{font-size:46px;flex:none;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-5px)}}.prompt{font-size:22px;font-weight:900;line-height:1.35}.translation{font-size:14px;color:var(--muted);margin-top:5px}.answers{display:grid;gap:11px}.answer{background:white;border:2px solid #dce5eb;border-radius:14px;padding:14px 16px;text-align:left;font:800 17px Nunito;cursor:pointer;color:var(--ink)}.answer:hover{background:#f5fbff;border-color:#9fdcff}.answer.selected{border-color:var(--blue);background:#eefaff}.answer.correct{border-color:var(--green);background:#efffe5;color:#397c00}.answer.wrong{border-color:#ff4b4b;background:#fff0f0;color:#c83030}.answer:disabled{cursor:default}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}.hint{font-size:14px;color:var(--muted);font-weight:700;min-height:24px}.btn{border:0;border-radius:13px;padding:13px 22px;font:900 15px Nunito;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}.primary{background:var(--green);color:white;box-shadow:0 4px 0 var(--dark)}.primary:disabled{background:#dce5eb;color:#9aa9b4;box-shadow:0 4px 0 #cad5dc;cursor:not-allowed}.secondary{background:#effaff;color:#1388be}.feedback{margin-top:16px;padding:13px 16px;border-radius:12px;font-weight:800;display:none}.feedback.show{display:block}.feedback.good{background:#efffe5;color:#438c00}.feedback.bad{background:#fff0f0;color:#c83030}.complete{text-align:center;padding:42px 18px}.complete .trophy{font-size:72px}.complete h1{font-size:32px;margin:10px}.complete p{font-size:17px;color:var(--muted);font-weight:700}.stat{display:inline-block;background:#fff8dc;border:2px solid #ffe184;padding:11px 20px;border-radius:14px;margin:10px;font-weight:900}.bottom{text-align:center;font-size:12px;color:#a4b0b8;margin-top:27px}.backline{margin-bottom:15px}.timer{font-weight:1000;color:#dd8c00}
@media(max-width:700px){.shell{padding:14px}.layout{display:block;margin-top:18px}.side{display:none}.title{font-size:25px}.card{padding:18px}.tiles{grid-template-columns:1fr}.pronouns{grid-template-columns:repeat(3,1fr)}.brand{font-size:19px}.welcome{font-size:27px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">✨ ¡Hola, español!</div><div class="top-right">❤️ <span id="hearts">5</span></div></header><div class="layout"><nav class="side" id="side"></nav><main class="main" id="app"></main></div><div class="bottom">Una práctica corta cada día hace la diferencia 🌱</div></div>
<script>
const lesson=[
{q:"Completa: ___ despierto a las siete.",en:"I wake up at seven.",opts:["Me","Te","Se","Nos"],a:"Me",why:"Con «yo» usamos me: me despierto."},
{q:"Lucía ___ ducha por la mañana.",en:"Lucía showers in the morning.",opts:["me","se","nos","te"],a:"se",why:"Lucía = ella: ella se ducha."},
{q:"¿Qué pronombre va con «nosotros»?",en:"Choose the reflexive pronoun for we.",opts:["se","me","nos","os"],a:"nos",why:"Nosotros y nosotras se combinan con nos."},
{q:"Tú ___ cepillas los dientes después del desayuno.",en:"You brush your teeth after breakfast.",opts:["te","se","me","nos"],a:"te",why:"Con «tú» usamos te: te cepillas."},
{q:"Mis hermanos ___ acuestan tarde.",en:"My siblings go to bed late.",opts:["os","nos","se","me"],a:"se",why:"Con «ellos/ellas» usamos se: se acuestan."},
{q:"Cada mañana, nosotros ___ vestimos rápido.",en:"Every morning, we get dressed quickly.",opts:["nos","se","me","te"],a:"nos",why:"«Nosotros» + nos: nos vestimos."},
{q:"Yo ___ lavo la cara antes de desayunar.",en:"I wash my face before breakfast.",opts:["se","me","te","nos"],a:"me",why:"Con «yo» usamos me: me lavo."},
{q:"Ustedes ___ preparan para ir a clase.",en:"You all get ready to go to class.",opts:["se","nos","os","me"],a:"se",why:"«Ustedes» usa se."},
{q:"Ordena la idea: «me / por la noche / acuesto»",en:"I go to bed at night.",opts:["Me acuesto por la noche.","Acuesto me por la noche.","Por la noche acuesto."],a:"Me acuesto por la noche.",why:"El pronombre va antes del verbo conjugado: me acuesto."},
{q:"Él ___ peina antes de salir.",en:"He combs his hair before leaving.",opts:["te","se","me","nos"],a:"se",why:"Con «él» usamos se: se peina."},
{q:"Vosotras ___ maquilláis para la fiesta.",en:"You (Spain, plural) put on makeup for the party.",opts:["os","se","nos","te"],a:"os",why:"Con «vosotros/vosotras» usamos os."},
{q:"Por la noche, Ana ___ desmaquilla.",en:"At night, Ana removes her makeup.",opts:["me","te","se","nos"],a:"se",why:"Ana = ella: ella se desmaquilla."}
];
const pronounQs=[
{q:"¿Qué pronombre reflexivo corresponde a «yo»?",en:"Elige la pareja correcta.",opts:["me","te","se","nos"],a:"me",why:"Yo → me."},
{q:"«Tú» se combina con…",en:"Completa la pareja del pronombre.",opts:["se","te","os","me"],a:"te",why:"Tú → te."},
{q:"Ella ___ lava la cara.",en:"Escoge el pronombre que falta.",opts:["nos","me","se","te"],a:"se",why:"Ella → se."},
{q:"«Nosotros» se combina con…",en:"Elige el pronombre reflexivo.",opts:["os","se","nos","te"],a:"nos",why:"Nosotros → nos."},
{q:"Vosotros ___ levantáis temprano.",en:"Elige el pronombre que completa la frase.",opts:["os","se","me","nos"],a:"os",why:"Vosotros → os."},
{q:"Mis amigas ___ preparan para salir.",en:"El sujeto está en plural.",opts:["me","se","te","nos"],a:"se",why:"Ellas → se."}
];
const challengeQs=[
{q:"Antes de desayunar, yo ___ cepillo los dientes.",en:"¡Reto rápido! Elige la forma correcta.",opts:["me","se","nos","te"],a:"me",why:"Yo me cepillo los dientes."},
{q:"Carlos ___ despierta a las seis.",en:"¡Reto rápido! Elige la forma correcta.",opts:["se","te","os","me"],a:"se",why:"Carlos se despierta."},
{q:"Tú ___ acuestas muy tarde.",en:"¡Reto rápido! Elige la forma correcta.",opts:["nos","te","me","se"],a:"te",why:"Tú te acuestas."},
{q:"Nosotras ___ ponemos el pijama.",en:"¡Reto rápido! Elige la forma correcta.",opts:["se","os","nos","te"],a:"nos",why:"Nosotras nos ponemos el pijama."},
{q:"Mis padres ___ levantan temprano.",en:"¡Reto rápido! Elige la forma correcta.",opts:["me","se","te","os"],a:"se",why:"Ellos se levantan."},
{q:"Completa: por la mañana, ___ ducho y ___ visto.",en:"Dos pronombres, mismo sujeto: yo.",opts:["me / me","se / se","te / te","nos / nos"],a:"me / me",why:"Con «yo» usamos me en los dos verbos."},
{q:"Ustedes ___ lavan las manos antes de comer.",en:"¡Reto rápido! Elige la forma correcta.",opts:["os","nos","se","me"],a:"se",why:"Ustedes se lavan."},
{q:"Ordena: «se / Daniela / peina»",en:"¡Construye la oración!",opts:["Daniela se peina.","Se Daniela peina.","Daniela peina se."],a:"Daniela se peina.",why:"El pronombre va antes del verbo conjugado."}
];
const modes={lesson:{title:"Lección diaria",emoji:"🌞",data:lesson},pronouns:{title:"Practicar pronombres",emoji:"🧩",data:pronounQs},challenge:{title:"Desafío",emoji:"🏆",data:challengeQs}};
let mode="lobby",questions=[],idx=0,hearts=5,score=0,chosen=null,locked=false;
const app=document.getElementById("app"),side=document.getElementById("side");
function drawNav(){side.innerHTML=[["lobby","🏠","Lobby"],["lesson","🌞","Rutina diaria"],["pronouns","🧩","Pronombres"],["challenge","🏆","Desafío"]].map(([m,e,t])=>'<button class="nav '+(mode===m?"active":"")+'" onclick="go(''+m+'')"><span>'+e+'</span>'+t+'</button>').join("")}
function go(m){mode=m;drawNav();if(m==="lobby"){showLobby();return}questions=modes[m].data;idx=0;hearts=5;score=0;document.getElementById("hearts").textContent=hearts;renderQuestion()}
function showLobby(){app.innerHTML='<div class="eyebrow">TU ESPACIO DE APRENDIZAJE</div><h1 class="welcome">¿Qué quieres practicar hoy? ✨</h1><p class="welcomesub">Elige una actividad para empezar. Puedes volver aquí cuando quieras.</p><div class="tiles"><button class="tile" onclick="go(\'lesson\')"><div class="emoji">🌞</div><h3>Practicar lección</h3><p>Completa frases de la rutina diaria y repasa los verbos reflexivos.</p><small>12 preguntas · empezar →</small></button><button class="tile" onclick="go(\'pronouns\')"><div class="emoji">🧩</div><h3>Practicar pronombres</h3><p>Domina las parejas me, te, se, nos, os y se.</p><small>6 preguntas · empezar →</small></button><button class="tile" onclick="go(\'challenge\')"><div class="emoji">🏆</div><h3>Desafío</h3><p>Pon a prueba lo que sabes con frases variadas y un reto extra.</p><small>8 preguntas · aceptar reto →</small></button><button class="tile" onclick="showGuide()"><div class="emoji">📖</div><h3>Repasar la regla</h3><p>Consulta rápidamente qué pronombre corresponde a cada persona.</p><small>guía rápida →</small></button></div>'}
function showGuide(){app.innerHTML='<div class="backline"><button class="btn secondary" onclick="go(\'lobby\')">← Volver al lobby</button></div><div class="card"><div class="eyebrow">GUÍA RÁPIDA</div><h1 class="title">Pronombres reflexivos</h1><p class="sub">El pronombre concuerda con la persona que realiza la acción.</p><div class="pronouns">'+[['yo','me'],['tú','te'],['él / ella / usted','se'],['nosotros/as','nos'],['vosotros/as','os'],['ellos / ellas / ustedes','se']].map(x=>'<div class="pronoun">'+x[0]+'<b>'+x[1]+'</b></div>').join("")+'</div><p><b>Ejemplo:</b> Yo <b>me</b> despierto. · Tú <b>te</b> vistes. · Ellas <b>se</b> acuestan.</p></div>'}
function renderQuestion(){if(idx>=questions.length||hearts<=0){finish();return}chosen=null;locked=false;const x=questions[idx];const isChallenge=mode==="challenge";app.innerHTML='<div class="backline"><button class="btn secondary" onclick="go(\'lobby\')">← Volver al lobby</button></div><div class="eyebrow">'+modes[mode].emoji+' '+modes[mode].title.toUpperCase()+' · PREGUNTA '+(idx+1)+' DE '+questions.length+'</div><h2 class="title">Elige la respuesta correcta</h2><p class="sub">'+(isChallenge?"¡A por todas! Cada acierto suma puntos.":"Completa la frase con el pronombre reflexivo.")+'</p><section class="card"><div class="question-row"><div class="mascot">🦉</div><div><div class="prompt">'+x.q+'</div><div class="translation">'+x.en+'</div></div></div><div class="answers">'+x.opts.map((o,n)=>'<button class="answer" data-n="'+n+'" onclick="selectAnswer('+n+')">'+String.fromCharCode(65+n)+'. &nbsp;'+o+'</button>').join("")+'</div><div id="feedback" class="feedback"></div><div class="actions"><div class="hint" id="hint">Toca una opción para responder.</div><button id="check" class="btn primary" disabled onclick="checkAnswer()">Comprobar</button></div></section>'}
function selectAnswer(n){if(locked)return;chosen=n;document.querySelectorAll(".answer").forEach(b=>b.classList.toggle("selected",+b.dataset.n===n));document.getElementById("check").disabled=false;document.getElementById("hint").textContent="¡Listo! Pulsa comprobar."}
function checkAnswer(){if(chosen===null||locked)return;locked=true;const x=questions[idx],picked=x.opts[chosen],correct=picked===x.a;document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.textContent.includes(x.a))b.classList.add("correct");if(+b.dataset.n===chosen&&!correct)b.classList.add("wrong")});const fb=document.getElementById("feedback");fb.className="feedback show "+(correct?"good":"bad");fb.textContent=(correct?"¡Muy bien! 🎉 ":"Casi, ¡tú puedes! 💪 ")+x.why;if(correct)score++;else hearts--;document.getElementById("hearts").textContent=hearts;document.getElementById("hint").textContent="";const btn=document.getElementById("check");btn.disabled=false;btn.textContent=idx===questions.length-1||hearts===0?"Ver resultado":"Continuar";btn.onclick=()=>{idx++;renderQuestion()}}
function finish(){const pct=Math.round(score/questions.length*100);app.innerHTML='<section class="card complete"><div class="trophy">'+(pct>=75?"🏆":"🌟")+'</div><h1>'+(pct>=75?"¡Actividad completada!":"¡Buen intento!")+'</h1><p>'+(pct>=75?"¡Vas dominando los verbos reflexivos!":"Cada práctica te ayuda a aprender. ¡Vamos otra vez!")+'</p><div class="stat">⭐ '+score+' / '+questions.length+' correctas</div><div class="stat">❤️ '+hearts+' corazones</div><br><button class="btn primary" onclick="go(\'lobby\')">Volver al lobby</button> <button class="btn secondary" onclick="go(\''+mode+'\')">Repetir actividad ↻</button></section>'}
drawNav();showLobby();
</script></body></html>
